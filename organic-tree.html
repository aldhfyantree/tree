<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر الشجرة الطبيعية — الضفيان</title>
<style>body{margin:0;background:#eee9d9;color:#342a1e;font:15px Tahoma,Arial}header{padding:14px 20px;background:#fffaf0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px #0001}header b{font-size:19px}button,input,select{font:inherit;border:1px solid #c9bda5;border-radius:8px;padding:9px;background:#fffdf6}button{cursor:pointer;background:#5c6948;color:white;border:0}main{display:grid;grid-template-columns:290px 1fr;gap:12px;padding:12px}aside{background:#fffaf0;border-radius:12px;padding:15px;line-height:1.8}aside label{display:block;margin:12px 0 4px}aside input,aside select{width:100%;box-sizing:border-box}aside button{margin-top:12px;width:100%}#frame{background:#f8f4e9;border-radius:12px;overflow:auto;height:calc(100vh - 105px);text-align:center}svg{width:100%;height:100%;min-width:850px;min-height:680px}small{color:#726c5b}#status{font-size:12px;color:#75684e}@media(max-width:800px){main{display:block}aside{margin-bottom:10px}#frame{height:70vh}}</style>
<header><b>مختبر الشجرة الطبيعية</b><span>شجرة الضفيان — نموذج مستقل تجريبي</span><a href="index.html">العودة للموقع</a></header>
<main><aside><strong>توليد شجرة أنساب عضوية</strong><p>الآباء على الأغصان، والأطراف على الأوراق. الأغصان الزخرفية لا تمثل علاقات نسب.</p><label>عدد أبناء المؤسس</label><input id="roots" type="number" min="2" max="9" value="4"><label>عدد الأجيال</label><input id="depth" type="number" min="2" max="6" value="5"><label>كثافة التاج الزخرفي</label><input id="density" type="range" min="1" max="5" value="3"><label>توزيع جديد</label><button id="regen">توليد شكل مختلف</button><button id="save">تصدير SVG</button><p id="status"></p><small>هذه بيانات أنساب افتراضية لا تمثل أفراد العائلة. لا توجد أي تعديلات على قاعدة بيانات الموقع.</small></aside><div id="frame"><svg id="tree" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" aria-label="شجرة طبيعية تجريبية"></svg></div></main>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('tree');let seed=7;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function between(a,b){return a+(b-a)*rand()}function el(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);parent.append(e);return e}
function path(d,w,c,parent=svg){return el('path',{d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},parent)}
function leaf(x,y,a,r,withName,name){const g=el('g',{transform:'translate('+x+' '+y+') rotate('+a+')'});el('path',{d:'M0 0 Q'+(-r*.75)+' '+(-r*.85)+' 0 '+(-r*1.7)+' Q'+(r*.8)+' '+(-r*.8)+' 0 0',fill:withName?'#a1ac7a':(rand()>.45?'#8f9d70':'#b4b990'),stroke:'#647653','stroke-width':'.9'},g);path('M0 0 L0 '+(-r*1.4),.6,'#61714d',g);if(withName){const t=el('text',{x:0,y:-r*.75,'text-anchor':'middle','font-size':Math.max(8,r*.4),fill:'#292a1b',transform:'rotate('+(-a)+' 0 '+(-r*.75)+')'},g);t.textContent=name}return g}
const names=['محمد','عبدالله','إبراهيم','سعد','ناصر','خالد','علي','فهد','عبدالعزيز','صالح','حمد','راشد','يوسف','سليمان'];let counter=0;
function build(level,max,first=false){const node={name:first?'الجد المؤسس':names[counter++%names.length],kids:[]};if(level<max){const n=first?+document.getElementById('roots').value:Math.floor(between(0,4.2));for(let i=0;i<n;i++)node.kids.push(build(level+1,max))}return node}
function count(n){return n.kids.length?n.kids.reduce((s,c)=>s+count(c),0):1}
function generate(){seed=(seed+Math.floor(Math.random()*100000))>>>0;svg.replaceChildren();const defs=el('defs',{}),grad=el('linearGradient',{id:'bark',x1:'0%',y1:'0%',x2:'100%',y2:'0%'},defs);[['0%','#392b22'],['45%','#76523b'],['80%','#51382b'],['100%','#30241e']].forEach(([offset,color])=>el('stop',{offset,'stop-color':color},grad));
const bg=el('rect',{width:1200,height:920,fill:'#f8f4e9'});const max=+document.getElementById('depth').value,root=build(0,max-1,true),leaves=count(root),density=+document.getElementById('density').value;let branches=0;
el('path',{d:'M548 913 Q563 845 557 772 Q552 706 565 652 Q580 595 592 548 L623 548 Q599 608 595 663 Q585 740 610 813 Q625 867 650 913 Z',fill:'url(#bark)',stroke:'#382a20','stroke-width':3});
for(let i=0;i<75;i++){const x=between(568,606),y=between(610,895);path('M'+x+' '+y+' q'+between(-10,10)+' -'+between(20,85)+' '+between(-12,12)+' -'+between(15,55),between(.4,1.8),'#30271f66')}
function grow(n,x,y,angle,length,width,level,sectorStart,sectorEnd){const angle2=angle+between(-.21,.21),ex=x+Math.cos(angle2)*length,ey=y-Math.sin(angle2)*length;const midx=x+(ex-x)*between(.42,.63)+between(-13,13),midy=y+(ey-y)*between(.42,.63)+between(-13,13);const d='M'+x.toFixed(1)+' '+y.toFixed(1)+' Q'+midx.toFixed(1)+' '+midy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);path(d,width+2,'#322820');path(d,width,'#694a35');branches++;
if(n.kids.length){if(level>0){const text=el('text',{x:midx,y:midy-7,'font-size':Math.max(10,16-level),'text-anchor':'middle',fill:'#3b2d21',stroke:'#f8f4e9','stroke-width':3,'paint-order':'stroke'});text.textContent=n.name}
const weights=n.kids.map(count),total=weights.reduce((a,b)=>a+b,0);let at=sectorStart;
n.kids.forEach((child,i)=>{const share=(sectorEnd-sectorStart)*weights[i]/total,end=at+share,center=(at+end)/2;const offset=between(.45,.94),cx=x+(ex-x)*offset,cy=y+(ey-y)*offset;let a=center+between(-.11,.11);const l=Math.max(29,length*between(.66,.91));grow(child,cx,cy,a,l,Math.max(1.3,width*between(.58,.77)),level+1,at,end);at=end});
}else{leaf(ex,ey,angle2*180/Math.PI-90,between(23,32),true,n.name)}
if(level>0){const extras=Math.floor(density*between(.65,1.5));for(let i=0;i<extras;i++){const t=between(.45,.96),bx=x+(ex-x)*t,by=y+(ey-y)*t,a=angle2+between(-.8,.8),l=between(17,54)*(1-level/(max+2)),xx=bx+Math.cos(a)*l,yy=by-Math.sin(a)*l;path('M'+bx+' '+by+' Q'+(bx+xx)/2+' '+(by+yy)/2+' '+xx+' '+yy,between(.7,2.4),'#73523b');if(rand()>.25)leaf(xx,yy,a*180/Math.PI-90,between(10,19),false,'')}}
}
const first=root.kids,step=2.3/Math.max(1,first.length);first.forEach((child,i)=>{const a=.45+i*step,px=592+between(-12,12),py=575+between(-15,20);grow(child,px,py,a,between(145,205),between(13,19),1,a-.23,a+.23)});
for(let i=0;i<density*110;i++){const a=between(.25,2.9),r=Math.sqrt(rand()),x=600+Math.cos(a)*between(125,430)*r,y=570-Math.sin(a)*between(160,440)*r;if(x>85&&x<1110&&y>55&&y<665)leaf(x,y,between(-170,170),between(7,14),false,'')}
const title=el('text',{x:600,y:65,'text-anchor':'middle','font-size':32,fill:'#4b392c'});title.textContent='شجرة أنساب عضوية — تجربة رسم';const sub=el('text',{x:600,y:98,'text-anchor':'middle','font-size':15,fill:'#87755c'});sub.textContent='بيانات افتراضية · توزيع غير منتظم · أغصان زخرفية';document.getElementById('status').textContent='الأطراف: '+leaves+' | أغصان النسب: '+branches+' | جيل: '+max}
document.getElementById('regen').onclick=generate;document.getElementById('save').onclick=()=>{const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='organic-family-tree.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};generate();
</script></html>
