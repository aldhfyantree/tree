    <style>
      body {
        min-height: 100vh;
      }
      .pdf-page {
        max-width: 1500px;
        margin: auto;
        padding: 24px;
      }
      .pdf-head {
        margin-bottom: 18px;
      }
      .pdf-head h1 {
        font-size: clamp(22px, 4vw, 38px);
        margin: 0;
        color: var(--green);
      }
      .pdf-head p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .pdf-viewer {
        width: 100%;
        min-height: 70vh;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #e8e4da;
        box-shadow: var(--shadow);
        padding: 14px;
        overflow: auto;
        text-align: center;
      }
      .pdf-viewer canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
        margin: auto;
        background: #fff;
        box-shadow: 0 6px 24px #0002;
      }
      .pdf-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .pdf-open-hint {
        display: inline-block;
        margin: 14px auto 2px;
        background: var(--green);
        color: #fff;
        border-radius: 24px;
        padding: 9px 18px;
        font-size: 11px;
      }
      .pdf-loading {
        padding: 80px 20px;
        color: var(--muted);
      }
      .nav-link {
        text-decoration: none;
        display: inline-block;
      }
      @media (max-width: 800px) {
        .pdf-page {
          padding: 14px;
        }
        .pdf-head {
          align-items: flex-start;
          flex-direction: column;
        }
        .pdf-viewer {
          padding: 5px;
          border-radius: 12px;
        }
      }
    </style>

    <main class="pdf-page">
      <div class="pdf-head">
        <div>
          <h1>شجرة عائلة الضفيان الأولى</h1>
          <p>
            تم العمل على جمع وترتيب ومتابعة هذا الإصدار على يد الأستاذ علي بن
            محمد بن علي الضفيان.
          </p>
        </div>
      </div>
      <div id="pdfViewer" class="pdf-viewer">
        <a
          class="pdf-link"
          href="shajarat-aldhfyan-original.pdf"
          aria-label="فتح الشجرة المطبوعة بالجودة الكاملة"
        >
          <p id="pdfLoading" class="pdf-loading">
            جارٍ فتح معاينة الإصدار الأول…
          </p>
          <canvas id="pdfCanvas" hidden></canvas>
          <span class="pdf-open-hint">اضغط لفتح النسخة عالية الجودة</span>
        </a>
      </div>
    </main>
